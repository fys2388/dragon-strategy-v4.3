name: 每日持仓监控

on:
  # 定时推送已停用（2026-09-29 用户取消持仓监控），仅保留手动触发。
  # 需要恢复时加回下面的 schedule；注意本仓库 GitHub cron 实测延迟 4h+，
  # 定 06:00 UTC 实际约 18:20-20:10 BJT 才执行，并非 14:00 准时。
  #   schedule:
  #     - cron: '0 6 * * 1-5'  # 北京时间14:00（UTC 06:00），工作日
  workflow_dispatch:

jobs:
  position-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy

      - name: 运行持仓监控
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          PUSH_ALL_POSITIONS: "true"
        run: |
          python scripts/daily_position_monitor.py

      - name: 上传运行日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: position-monitor-log
          path: data/positions.json
