# -*- coding: utf-8 -*-
# 收盘复盘推送：北京时间 15:30 → UTC 07:30，周一到周五
name: Evening Review Push

on:
  # schedule 已禁用：GitHub Actions cron 严重延迟，复盘被拖到半夜。改由外部调度器触发。
  # schedule:
  #   - cron: '30 7 * * 1-5'
  workflow_dispatch:

jobs:
  push_review:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests pandas numpy akshare

      - name: Run evening review push
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: python scripts/daily_review_push.py

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-log-${{ github.run_id }}
          path: logs/
          if-no-files-found: warn
