# -*- coding: utf-8 -*-
# V1.0 策略推送：盘前/午盘/尾盘/周报/月报（非5分钟级）。
# cron 时间表（GitHub Actions 使用 UTC，北京时间 = UTC+8）：
# - 盘前完整版   9:15  BJT  → cron '15 1 * * 1-5'
# - 午盘完整版   11:30 BJT  → cron '30 3 * * 1-5'
# - 尾盘完整版   14:50 BJT  → cron '50 6 * * 1-5'
# - 周度报告     周日 20:00 → cron '0 12 * * 0'
# - 月度报告     每月28日 20:00 → cron '0 12 28 * *'
name: V1.0 MACD多周期共振策略推送

on:
  schedule:
    - cron: '15 1 * * 1-5'
    - cron: '30 3 * * 1-5'
    - cron: '50 6 * * 1-5'
    - cron: '0 12 * * 0'
    - cron: '0 12 28 * *'
  workflow_dispatch:

jobs:
  push-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests pandas numpy akshare

      - name: Run MACD resonance push
        run: python scripts/v43_push.py
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
