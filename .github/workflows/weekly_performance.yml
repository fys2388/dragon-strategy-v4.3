name: 每周策略绩效报告

on:
  schedule:
    # 每周日 UTC 12:00 = 北京时间 20:00
    - cron: '0 12 * * 0'
  workflow_dispatch:

jobs:
  weekly-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests pandas -q

      - name: Run weekly performance report
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          PUSH_FEISHU: 'true'
          IS_CLOUD: 'true'
        run: |
          python scripts/weekly_report.py
