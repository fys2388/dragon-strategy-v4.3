# -*- coding: utf-8 -*-
# 盘前 + 午盘推送。
# cron 时间表（GitHub Actions 使用 UTC，北京时间 = UTC+8）：
# - 盘前 09:15 BJT → cron '15 1 * * 1-5'
# - 午盘 11:35 BJT → cron '35 3 * * 1-5'
name: Morning & Noon Report Push

on:
  schedule:
    - cron: '15 1 * * 1-5'
    - cron: '35 3 * * 1-5'
  workflow_dispatch:

jobs:
  push_report:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests pandas numpy

      - name: Run Morning/Noon Push
        run: python3 scripts/morning_noon_push.py
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}

      - name: Done
        run: echo "Report pushed at $(date)"
