# -*- coding: utf-8 -*-
# 盘前报告推送：仅保留 09:15 盘前（盘中扫描由 strategy-push.yml 负责）
# 北京时间 09:15 → UTC 01:15
name: Morning & Noon Report Push

on:
  schedule:
    # 盘前报告 (北京时间 09:15 → UTC 01:15)
    - cron: '15 1 * * 1-5'
  workflow_dispatch:

jobs:
  push_report:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests pandas numpy akshare

      - name: Run morning/noon push
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: python scripts/morning_noon_push.py

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-log-${{ github.run_id }}
          path: logs/
          if-no-files-found: warn
