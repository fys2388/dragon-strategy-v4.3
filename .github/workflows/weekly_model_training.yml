name: 每周模型训练

on:
  schedule:
    - cron: '0 13 * * 0'  # 每周日UTC 13:00（北京时间21:00）
  workflow_dispatch:

jobs:
  train-model:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy lightgbm scikit-learn

      - name: 运行模型训练
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: |
          python scripts/weekly_model_training.py

      - name: 上传模型文件
        uses: actions/upload-artifact@v4
        with:
          name: trained-models
          path: |
            data/models/
          retention-days: 30
