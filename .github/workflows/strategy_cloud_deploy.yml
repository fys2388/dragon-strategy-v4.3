# -*- coding: utf-8 -*-
# V1.0 云端策略推送：唯一盘中推送工作流（云端部署，推送至飞书）。
# 数据源三源降级（东财→新浪→AkShare），新浪对海外IP友好，云端可稳定取数。
# cron 时间表（GitHub Actions 使用 UTC，北京时间 = UTC+8）：
# - 盘前报告     9:15  BJT  →  cron '15 1 * * 1-5'（REPORT_MODE=premarket，发盘前报告）
# - 盘中上午     10:00-11:59 每10分钟 → cron '*/10 2-3 * * 1-5'
# - 盘中下午     13:00-14:59 每10分钟 → cron '*/10 5-6 * * 1-5'
# - 尾盘完整版   14:50  BJT  →  cron '50 6 * * 1-5'
name: V1.0 MACD多周期共振策略云推送
run-name: "云端策略推送 @ ${{ github.actor }}"

on:
  schedule:
    # 盘前 9:15 北京时间 = 1:15 UTC
    - cron: '15 1 * * 1-5'
    # 盘中上午 每10分钟（UTC 2:00-3:59 = 北京 10:00-11:59；午休由脚本 should_run 兜底跳过）
    - cron: '*/10 2-3 * * 1-5'
    # 盘中下午 每10分钟（UTC 5:00-6:59 = 北京 13:00-14:59）
    - cron: '*/10 5-6 * * 1-5'
    # 尾盘完整版 14:50 北京时间 = 6:50 UTC
    - cron: '50 6 * * 1-5'
  workflow_dispatch:
    inputs:
      test_mode:
        description: '启用测试模式（跳过交易时段检查）'
        type: boolean
        default: false

jobs:
  run-strategy-push:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy akshare

      - name: 运行MACD多周期共振策略推送
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          IS_CLOUD: "true"
          TEST_MODE: ${{ inputs.test_mode || 'false' }}
          # 按触发档位决定报告类型：9:15 档发盘前报告，其余档发盘中实时扫描。
          # github.event.schedule 是触发本次运行的 cron 表达式（workflow_dispatch 时为 null → scan）。
          REPORT_MODE: ${{ github.event.schedule == '15 1 * * 1-5' && 'premarket' || 'scan' }}
        run: |
          python scripts/v43_push.py

      - name: 上传运行日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-log-${{ github.run_id }}
          path: logs/
          if-no-files-found: warn
