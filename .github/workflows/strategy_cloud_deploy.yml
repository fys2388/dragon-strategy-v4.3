# -*- coding: utf-8 -*-
# V1.0 云端策略推送：盘中5分钟级 + 尾盘完整版。
# cron 时间表（GitHub Actions 使用 UTC，北京时间 = UTC+8）：
# - 盘前完整版   9:15  BJT  →  cron '15 1 * * 1-5'
# - 盘中上午     10:00-11:30 每5分钟 → cron '0-55/5 2 * * 1-5' + '0-30/5 3 * * 1-5'
# - 盘中下午     13:00-14:30 每5分钟 → cron '0-55/5 5 * * 1-5' + '0-30/5 6 * * 1-5'
# - 尾盘完整版   14:50  BJT  →  cron '50 6 * * 1-5'
name: V1.0 MACD多周期共振策略云推送
run-name: "云端策略推送 @ ${{ github.actor }}"

on:
  schedule:
    # 盘前 9:15 北京时间 = 1:15 UTC
    - cron: '15 1 * * 1-5'
    # 盘中上午 10:00-11:30 每5分钟（2:00-3:30 UTC）
    - cron: '0-55/5 2 * * 1-5'
    - cron: '0-30/5 3 * * 1-5'
    # 盘中下午 13:00-14:30 每5分钟（5:00-6:30 UTC）
    - cron: '0-55/5 5 * * 1-5'
    - cron: '0-30/5 6 * * 1-5'
    # 尾盘完整版 14:50 北京时间 = 6:50 UTC
    - cron: '50 6 * * 1-5'
  workflow_dispatch:
    inputs:
      test_mode:
        description: '启用测试模式（跳过交易时段检查）'
        type: boolean
        default: false

jobs:
  run-strategy-push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy

      - name: 运行MACD多周期共振策略推送
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          IS_CLOUD: "true"
          TEST_MODE: ${{ inputs.test_mode || 'false' }}
        run: |
          python scripts/v43_push.py

      - name: 上传运行日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-log-${{ github.run_id }}
          path: logs/
          if-no-files-found: warn
