name: V1.0 MACD多周期共振策略云推送
run-name: "云端策略推送 @ ${{ github.actor }}"

on:
  schedule:
    - cron: '15 1 * * 1-5'
    - cron: '0,5,10,15,20,25,30,35,40,45,50,55 2-3 * * 1-5'
    - cron: '0,5,10,15,20,25,30,35,40,45,50,55 5-6 * * 1-5'
    - cron: '0 10 * * 1-5'
  workflow_dispatch:
    inputs:
      test_mode:
        description: '启用测试模式（跳过交易时段检查）'
        type: boolean
        default: false

jobs:
  run-strategy-push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy

      - name: 运行MACD多周期共振策略推送
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          IS_CLOUD: "true"
          TEST_MODE: ${{ inputs.test_mode || 'false' }}
        run: |
          python scripts/v43_push.py

      - name: 上传运行日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-log-${{ github.run_id }}
          path: stock_push.log
