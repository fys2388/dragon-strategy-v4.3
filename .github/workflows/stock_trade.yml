name: V4.3.1 Stock Assistant
on:
  schedule:
    - cron: '*/5 1-3 * * 1-5'
    - cron: '*/5 5-6 * * 1-5'
  workflow_dispatch:

jobs:
  run_strategy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: pip install requests --quiet
      
      - name: Run V4.3.1 Strategy
        run: |
          python3 scripts/v43_push.py
      
      - name: Done
        run: echo "Workflow completed"
