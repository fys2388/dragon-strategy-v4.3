# 临时诊断：验证标的池分页
name: Diag Pool
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Diagnose pool fetch
        run: |
          pip install requests pandas numpy --quiet
          python - <<'PY'
          import time
          from strategies.macd_resonance import data_source as ds
          t0 = time.time()
          stocks = ds.get_mainboard_stocks(limit=3000)
          dt = time.time() - t0
          print(f'POOL_RESULT count={len(stocks)} elapsed={dt:.1f}s')
          codes = [s["code"] for s in stocks]
          print('sample:', codes[:8])
          print('unique:', len(set(codes)))
          PY
